# Portainer stack. Set the variables below in the stack's "Environment variables" section
# (or an .env file next to this compose file when using docker compose directly).
services:
  wildix-halo-mcp:
    # Published by .github/workflows/docker-publish.yml, e.g. <dockerhub-user>/wildix-halo-mcp:latest
    image: ${WILDIX_HALO_MCP_IMAGE:-wildix-halo-mcp:latest}
    build: .
    container_name: wildix-halo-mcp
    restart: unless-stopped
    environment:
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MCP_API_KEY: ${MCP_API_KEY:?set MCP_API_KEY}
      TOKEN_SECRET: ${TOKEN_SECRET:?set TOKEN_SECRET}
      TOKEN_TTL_MIN: ${TOKEN_TTL_MIN:-60}
      HALO_BASE_URL: ${HALO_BASE_URL:?set HALO_BASE_URL}
      HALO_AUTH_URL: ${HALO_AUTH_URL:?set HALO_AUTH_URL}
      HALO_TENANT: ${HALO_TENANT:-}
      HALO_CLIENT_ID: ${HALO_CLIENT_ID:?set HALO_CLIENT_ID}
      HALO_CLIENT_SECRET: ${HALO_CLIENT_SECRET:?set HALO_CLIENT_SECRET}
      HALO_SCOPE: ${HALO_SCOPE:-read:tickets edit:tickets read:customers}
      HALO_TICKETTYPE_ID: ${HALO_TICKETTYPE_ID:-}
      HALO_TEAM_ID: ${HALO_TEAM_ID:-}
      HALO_PRIORITY_LOW: ${HALO_PRIORITY_LOW:-}
      HALO_PRIORITY_NORMAL: ${HALO_PRIORITY_NORMAL:-}
      HALO_PRIORITY_HIGH: ${HALO_PRIORITY_HIGH:-}
      HALO_TICKET_SOURCE_ID: ${HALO_TICKET_SOURCE_ID:-}
      HALO_UPDATE_OUTCOME_ID: ${HALO_UPDATE_OUTCOME_ID:-}
      HALO_UPDATE_NEW_STATUS_ID: ${HALO_UPDATE_NEW_STATUS_ID:-}
      HALO_CLOSED_STATUS_IDS: ${HALO_CLOSED_STATUS_IDS:-9}
      HALO_UNVERIFIED_USER_ID: ${HALO_UNVERIFIED_USER_ID:-19}
      HALO_UNVERIFIED_CLIENT_ID: ${HALO_UNVERIFIED_CLIENT_ID:-1}
      HALO_UNVERIFIED_SITE_ID: ${HALO_UNVERIFIED_SITE_ID:-1}
      UNVERIFIED_REQUESTS_PER_HOUR: ${UNVERIFIED_REQUESTS_PER_HOUR:-3}
      UNVERIFIED_REQUESTS_GLOBAL_PER_HOUR: ${UNVERIFIED_REQUESTS_GLOBAL_PER_HOUR:-30}
      # Test mode: confine everything to Halo "Test Co." and log every tool call to /data
      TEST_MODE: ${TEST_MODE:-false}
      TEST_CLIENT_ID: ${TEST_CLIENT_ID:-273}
      TEST_USER_ID: ${TEST_USER_ID:-338}
      TEST_UNVERIFIED_USER_ID: ${TEST_UNVERIFIED_USER_ID:-311}
      TEST_SITE_ID: ${TEST_SITE_ID:-290}
      TEST_VERIFY_MODE: ${TEST_VERIFY_MODE:-always}
      TOOL_LOG_FILE: ${TOOL_LOG_FILE:-/data/tool-calls.jsonl}
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-1}
      ALLOW_CLIENT_WIDE_TICKETS: ${ALLOW_CLIENT_WIDE_TICKETS:-false}
    ports:
      # Bind to localhost only; publish through your reverse proxy (TLS).
      # If the proxy runs as a container, drop this and join its network instead.
      - "127.0.0.1:3000:3000"
    volumes:
      - wildix-halo-mcp-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  wildix-halo-mcp-data:
